<script>
  const LOADER_TOTAL = 2200;

  const lines = [
    "[init] booting secure gateway…",
    "[ok]  entropy pool synced",
    "[ok]  tls handshake established",
    "[scan] verifying integrity…",
    "[ok]  signature valid",
    "[load] rendering landing…",
    "[ok]  ready"
  ];

  const term = document.getElementById("term");
  const barFill = document.getElementById("barFill");
  const loader = document.getElementById("loader");

  function addLine(text){
    const div = document.createElement("div");
    div.className = "line";
    div.innerHTML = text.replace("[ok]", "<strong>[ok]</strong>");
    term.appendChild(div);
    term.scrollTop = term.scrollHeight;
  }

  function hideLoader(){
    if (!loader) return;
    loader.classList.add("hidden");
  }

  // FAILSAFE: si quelque chose se passe mal, on cache le loader au bout de 4s max
  setTimeout(hideLoader, 4000);

  window.addEventListener("load", () => {
    try {
      const start = performance.now();
      let i = 0;

      const step = () => {
        const now = performance.now();
        const t = Math.min(1, (now - start) / LOADER_TOTAL);
        if (barFill) barFill.style.width = Math.round(t * 100) + "%";

        const targetIndex = Math.min(lines.length, Math.floor(t * (lines.length + 1)));
        while (i < targetIndex) { addLine(lines[i]); i++; }

        if (t < 1) requestAnimationFrame(step);
      };
      requestAnimationFrame(step);

      setTimeout(hideLoader, LOADER_TOTAL);
    } catch (e) {
      // si erreur JS, on affiche la page quand même
      hideLoader();
      console.error(e);
    }
  });

  // Raccourci: Escape pour skip
  window.addEventListener("keydown", (e) => {
    if (e.key === "Escape") hideLoader();
  });
</script>
