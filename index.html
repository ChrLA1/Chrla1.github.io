<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Charlie Ambert — Portfolio</title>
  <meta name="description" content="Page d’accueil — accès au portfolio Notion." />

  <style>
    :root{
      --bg1:#070A12;
      --bg2:#0B1630;
      --card: rgba(255,255,255,0.06);
      --stroke: rgba(255,255,255,0.12);
      --text: rgba(255,255,255,0.92);
      --muted: rgba(255,255,255,0.70);
      --accent: #6EE7FF;
    }

    *{ box-sizing:border-box; }
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial;
      color:var(--text);
      min-height:100vh;
      background:
        radial-gradient(1000px 600px at 20% 10%, rgba(110,231,255,0.18), transparent 60%),
        radial-gradient(900px 700px at 80% 30%, rgba(124,58,237,0.18), transparent 55%),
        linear-gradient(135deg, var(--bg1), var(--bg2));
      display:grid;
      place-items:center;
      overflow:hidden;
    }

    /* Fond animé (subtil) */
    .glow{
      position:fixed; inset:-40%;
      background: conic-gradient(from 180deg,
        rgba(110,231,255,0.10),
        rgba(124,58,237,0.10),
        rgba(110,231,255,0.10));
      filter: blur(60px);
      animation: spin 10s linear infinite;
      pointer-events:none;
      opacity:0.7;
    }
    @keyframes spin { to{ transform: rotate(360deg); } }

    /* Loader */
    .loader{
      position:fixed; inset:0;
      display:grid; place-items:center;
      background: rgba(5,8,16,0.86);
      backdrop-filter: blur(6px);
      transition: opacity .35s ease, visibility .35s ease;
      z-index: 10;
    }
    .loader.hidden{ opacity:0; visibility:hidden; }

    .ring{
      width:54px; height:54px;
      border-radius:50%;
      border:4px solid rgba(255,255,255,0.18);
      border-top-color: var(--accent);
      animation: ring 0.9s linear infinite;
      box-shadow: 0 0 24px rgba(110,231,255,0.25);
    }
    @keyframes ring{ to{ transform: rotate(360deg); } }

    /* Carte */
    .card{
      width:min(720px, calc(100% - 32px));
      border:1px solid var(--stroke);
      background: var(--card);
      border-radius: 18px;
      padding: 28px;
      box-shadow: 0 20px 70px rgba(0,0,0,0.45);
      position:relative;
    }

    /* Fade-in */
    .fade{
      opacity:0;
      transform: translateY(10px);
      animation: fadeUp .75s ease forwards;
    }
    .d1{ animation-delay: .10s; }
    .d2{ animation-delay: .22s; }
    .d3{ animation-delay: .34s; }
    .d4{ animation-delay: .46s; }
    @keyframes fadeUp{
      to{ opacity:1; transform: translateY(0); }
    }

    h1{
      margin: 0 0 8px 0;
      font-size: clamp(22px, 4vw, 34px);
      letter-spacing: .2px;
    }
    p{ margin: 0; color: var(--muted); line-height:1.5; }

    .row{
      display:flex;
      gap:12px;
      flex-wrap:wrap;
      margin-top:18px;
    }

    a.btn{
      display:inline-flex;
      align-items:center;
      gap:10px;
      padding: 12px 16px;
      border-radius: 12px;
      border:1px solid rgba(110,231,255,0.35);
      background: rgba(110,231,255,0.12);
      color: var(--text);
      text-decoration:none;
      font-weight: 600;
      transition: transform .12s ease, background .2s ease, border-color .2s ease;
    }
    a.btn:hover{
      transform: translateY(-1px);
      background: rgba(110,231,255,0.18);
      border-color: rgba(110,231,255,0.55);
    }

    a.ghost{
      border-color: rgba(255,255,255,0.18);
      background: rgba(255,255,255,0.06);
    }

    .small{
      margin-top:16px;
      font-size: 13px;
      color: rgba(255,255,255,0.55);
    }
  </style>
</head>

<body>
  <div class="glow"></div>

  <div class="loader" id="loader" aria-label="Chargement">
    <div class="ring"></div>
  </div>

  <main class="card" role="main">
    <h1 class="fade d1">Charlie Ambert</h1>
    <p class="fade d2">BTS SIO (SISR) — alternance — AI Security / DevSecOps</p>

    <div class="row fade d3">
      <a class="btn" id="go"
         href="https://wooden-numeric-f32.notion.site/Portfolio-Charlie-Ambert-8539c1583f284974ac2d106a8d9a5387"
         target="_blank" rel="noopener">
        Accéder au portfolio
        <span aria-hidden="true">→</span>
      </a>

      <a class="btn ghost"
         href="https://github.com/ChrLA1/Trebiq"
         target="_blank" rel="noopener">
        Voir le GitHub
      </a>
    </div>

    <p class="small fade d4">
      Envoie ce lien GitHub Pages dans tes candidatures, et le bouton ouvre Notion.
    </p>
  </main>

  <script>
    // Loader minimal puis reveal
    window.addEventListener("load", () => {
      setTimeout(() => {
        document.getElementById("loader").classList.add("hidden");
      }, 900); // durée du loader (ms)
    });
  </script>
</body>
</html>
